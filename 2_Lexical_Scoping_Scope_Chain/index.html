<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Folder Structure Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sidebar">
      <div class="folder level-1">
        <span class="folder-name">📁 Root</span>
        <div class="folder level-2 hidden">
          <span class="folder-name">📁 src</span>
          <div class="folder level-3 hidden">
            <span class="folder-name">📄 index.html</span>
            <span class="folder-name">📄 index.js</span>
            <span class="folder-name">📄 style.css</span>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
