<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Content Formatter | Function Composition & Pipe</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo-section">
      <div class="js-badge">JS</div>
      <div class="title-group">
        <h1>Markdown Content Formatter</h1>
        <span class="sub-title">Function Composition & Data Pipelines: <code>pipe(trim, sanitize, markdown)(text)</code></span>
      </div>
    </div>
    <div class="header-actions">
      <div class="shortcut-tip">
        <span class="badge badge-purple">Pipeline Operator / Compose</span>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="workspace-grid">
      <!-- Left Panel: Raw Input Editor -->
      <div class="panel-card input-panel">
        <div class="panel-header">
          <div class="window-dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <div class="tab active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            rawContent.md
          </div>
        </div>
        <div class="panel-body">
          <div class="editor-wrap">
            <label for="input-text" class="field-label">Raw Text Stream</label>
            <textarea id="input-text" spellcheck="false" placeholder="Enter markdown or raw text here... (e.g. # Hello *World* <script>alert(1)</script>)"># Advanced JavaScript
**Function Composition** allows chaining multiple pure functions into a single pipeline.
- Trim whitespace
- Sanitize HTML tags
- Convert Markdown formatting</textarea>
          </div>
        </div>
      </div>

      <!-- Center Pipeline Trigger -->
      <div class="pipeline-bridge">
        <div class="controls">
          <button id="btn-format" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>
            Format Output (Pipe)
          </button>
        </div>
      </div>

      <!-- Right Panel: Formatted Output -->
      <div class="panel-card output-panel">
        <div class="panel-header">
          <div class="panel-title">
            <span class="badge badge-emerald">Pipe Result</span>
            <h2>Formatted View</h2>
          </div>
        </div>
        <div class="panel-body">
          <label class="field-label">Composed HTML Preview</label>
          <div id="output-text" class="rendered-output">
            Output will appear here
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
